schema_version: "1.0"
id: deckdna
name: DeckDNA Presentation Designer
version: "0.3.0"
description: >
  Converts an arbitrary PPTX/POTX template plus a content package into
  three editable, template-compliant presentation variants with built-in
  audit and user-selected repair.
license: Apache-2.0

requirements:
  container: true
  network: provider_only
  system_tools: [libreoffice, pdftoppm, python3.12]
  env_vars:
    - DECKDNA_PROVIDER_BASE_URL
    - DECKDNA_PROVIDER_API_KEY
    - DECKDNA_MODEL_TEXT
    - DECKDNA_MODEL_VISION

capabilities:
  streaming_events: false
  resume: false
  cancel: false

entrypoint:
  command: >-
    python3 skill/run_skill.py TEMPLATE CONTENT OUT_DIR
    [--purpose TEXT] [--audience TEXT] [--language ru] [--slides N]
    [--llm]
  status: implemented
  doc: skill/SKILL.md

inputs:
  - name: template
    kind: file
    required: true
    media_types:
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/vnd.openxmlformats-officedocument.presentationml.template
  - name: content
    kind: directory
    required: true
  - name: brief
    kind: text
    required: true
  - name: provider
    kind: credentials
    required: false
  - name: config
    kind: config
    required: false

outputs:
  - name: decks
    kind: file
    media_types:
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/pdf
      - text/html
  - name: quality_passport
    kind: report
  - name: progress
    kind: events
    status: implemented
    note: >-
      Job progress events are streamed via GET /api/v1/jobs/{id}/events
      and MCP get_job; the CLI entrypoint run_skill.py executes
      synchronously and writes summary.json upon completion.

tools:
  - name: run_skill
    description: >-
      Full pipeline, three times: arbitrary PPTX/POTX template + a
      content file/directory + a brief -> faithful/balanced/visual
      variants, each with native editable PPTX, PDF, HTML and a Quality
      Passport, plus a summary.json index (paths, checksums, status,
      timing) for the whole run.
    command: skill/run_skill.py
    input_schema: manifest:inputs.template+content+brief
    output_schema: skill/SKILL.md#outputs
    timeout_seconds: 900
    idempotent: false
    retryable: true
    status: implemented
    note: >-
      Requires an empty out_dir (or one holding only a summary.json from
      an earlier preflight failure) so previous artifacts are never
      overwritten silently.
  - name: inspect_template
    description: Parse a template into Design DNA, exemplar library and previews.
    input_schema: manifest:inputs.template
    output_schema: schemas/design-dna.schema.json
    timeout_seconds: 120
    idempotent: true
    retryable: true
    status: implemented
    command: deckdna inspect-template
  - name: ingest_content
    description: Normalize a content package and build the evidence graph.
    input_schema: schemas/content-pack.schema.json
    output_schema: schemas/evidence-graph.schema.json
    timeout_seconds: 120
    idempotent: true
    retryable: true
    status: implemented
    command: deckdna ingest
  - name: plan_deck
    description: Produce DeckPlan and three VariantSpecs from brief + evidence + design DNA.
    input_schema: manifest:inputs.brief+evidence_graph+design_dna
    output_schema: schemas/variant-spec.schema.json
    timeout_seconds: 120
    idempotent: true
    retryable: true
    status: implemented
    command: deckdna mcp
  - name: generate_deck
    description: Compose native editable PPTX variants from template exemplars.
    input_schema: schemas/variant-spec.schema.json
    output_schema: schemas/deck-plan.schema.json
    timeout_seconds: 300
    idempotent: true
    retryable: true
    status: implemented
    command: deckdna generate
  - name: audit_deck
    description: Run deterministic and contextual checks; emit AuditIssues.
    input_schema: manifest:artifact.pptx
    output_schema: schemas/audit-issue.schema.json
    timeout_seconds: 180
    idempotent: true
    retryable: true
    status: implemented
    command: deckdna audit
  - name: repair_deck
    description: Apply user-selected typed repair actions; produce new deck revision.
    input_schema: schemas/repair-action.schema.json
    output_schema: schemas/repair-action.schema.json
    timeout_seconds: 180
    idempotent: false
    retryable: true
    status: implemented
    command: deckdna repair
  - name: export_deck
    description: Export PPTX/PDF/HTML and Quality Passport.
    input_schema: manifest:artifact.deck_revision
    output_schema: schemas/quality-passport.schema.json
    timeout_seconds: 120
    idempotent: true
    retryable: true
    status: implemented
    command: deckdna export --format pdf|html|png

mcp:
  command: deckdna mcp --transport stdio
  http_command: deckdna mcp --transport http --host 0.0.0.0 --port 8765 [--api-url URL]
  transports: [stdio, http]
  doc: docs/MCP_RU.md
  status: implemented
  tools:
    - name: analyze_template
      description: Upload a PPTX/POTX template and build its Design DNA.
    - name: upload_content
      description: Content as one sentence, text or a file (incl. an old .pptx to re-layout).
    - name: plan_deck
      description: Content sufficiency estimate and the deck plan with fact origins.
    - name: research_slide
      description: Web facts or figures for one slide; homogeneous figures become a native chart.
    - name: generate_variants
      description: Build faithful/balanced/visual variants asynchronously (job id).
    - name: get_job
      description: Job state, progress, journal events; finished variants with resource URIs.
    - name: audit_deck
      description: Quality audit with repairable flags.
    - name: repair_issues
      description: Typed repairs of selected issues and re-audit.
    - name: export_deck
      description: Export PPTX/PDF/HTML/Quality Passport as artifact resources.
    - name: understand_content
      description: Semantic blocks, capacity and data insights from uploaded content.
    - name: get_questions
      description: Questions with reasons and recommended options for the user.
    - name: answer_questions
      description: Save the user's answers and return the complete brief.
    - name: confirm_insights
      description: Confirm or unconfirm only the insights explicitly accepted by the user.
    - name: style_previews
      description: Key slides in three styles; get_job returns the finished style_preview.
    - name: regenerate_slide
      description: Rebuild one slide with a preview and audit; preserve other slide XML bytes.
  resources:
    - uri: deckdna://templates/{template_id}/design-dna
    - uri: deckdna://variants/{variant_id}/quality-passport
    - uri: deckdna://artifacts/{artifact_id}
