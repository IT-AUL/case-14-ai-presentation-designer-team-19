# ADR-034: голос помощника (assistant_note) и варианты вопросов.
# Фразы детерминированные, модель не нужна. {n}, {points} и т. п. —
# подстановки из кода (backend/deckdna/assistant/).
version: "4"
understanding:
  enough: "Материала хватает примерно на {n} {slides}. Главное, что я вижу: {points}."
  enough_no_points: "Материала хватает примерно на {n} {slides}."
  short: "Материала мало, помогу на следующем шаге."
  data: "В данных вижу {points}. Интерпретации и предложения можно уточнить на карточках выводов."
questions:
  max_per_turn: 2
  none: "Всё понятно, вопросов нет: составлю план."
  some: "Пара уточнений, и составлю план."
  audience:
    reason: "Не знаю, для кого презентация: от этого зависят тон и подробность."
    options:
      - { value: "", label: "Пока не определено — нейтральный черновик", recommended: true }
      - { value: "руководство", label: "Руководство" }
      - { value: "совет директоров", label: "Совет директоров" }
      - { value: "команда", label: "Команда" }
      - { value: "клиенты", label: "Клиенты" }
  key_message:
    reason: "Сильных мыслей несколько, а главная не названа: колода должна держаться за одну."
  call_to_action:
    reason: "В выводах есть рекомендации, а цель выступления не задана."
    options:
      - { value: "принять решение", label: "Принять решение", recommended: true }
      - { value: "утвердить бюджет", label: "Утвердить бюджет" }
      - { value: "просто узнать", label: "Просто узнать" }
  length:
    reason: "Число слайдов не задано."
    ambiguous_reason: "Ограничение длины неоднозначно. Укажите одно число от 3 до 40; условие «ровно», «не более» или «примерно» можно задать командой."
    label: "{n} {slides}"
    recommended_note: "советую {n}: больше материала нет"
  content_short:
    reason: "Материала хватает на {have} из {want} слайдов."
    options:
      - { value: "shrink", label: "Сделать короче: {have} {slides}", recommended: true }
      - { value: "notes", label: "Я добавлю пару тезисов" }
      - { value: "expand_web", label: "Поискать в интернете" }
      - { value: "expand_model", label: "Дополнить из знаний модели (не подтверждено источником)" }
  content_exact:
    reason: "Запрошено ровно {want} слайдов, материала пока примерно на {have}. Как дополнить содержание, сохранив число страниц?"
    options:
      - { value: "notes", label: "Я добавлю тезисы, число слайдов сохраняем", recommended: true }
      - { value: "expand_web", label: "Поискать в интернете" }
      - { value: "expand_model", label: "Дополнить из знаний модели (не подтверждено источником)" }

session:
  intake: "Добавьте шаблон и материалы, начну с них."
  understanding: "Покажу, что понял из ваших материалов."
  questions: "Уточню несколько деталей перед планом."
  plan: "Могу составить план по вашим ответам."
  style: "Предлагаю выбрать стиль на пробных слайдах."
  generation: "Собираю колоду и проверяю слайды."
  ready: "Готово, можно посмотреть и доработать слайды."
  retry: "Сборка остановилась, можно повторить с сохранёнными материалами."
  autopilot: "Приму предложенные варианты и соберу колоду."
autopilot:
  insight_strength: 0.7
