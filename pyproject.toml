[project]
name = "deckdna"
version = "0.1.0"
description = "DeckDNA — presentation compiler: arbitrary PPTX template + content -> 3 editable audited variants"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "typer>=0.12",
    "lxml>=5.3",
    "python-pptx>=1.0",
    "pillow>=10.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
    "jsonschema>=4.23",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "datamodel-code-generator>=0.26",
    "reportlab>=4.0",
    "types-lxml",
]

[project.scripts]
deckdna = "deckdna.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/deckdna"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Generated by datamodel-code-generator; regenerated files must stay lint-clean.
"backend/deckdna/contracts/**" = ["UP035", "UP040"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deckdna.domain", "deckdna.contracts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
