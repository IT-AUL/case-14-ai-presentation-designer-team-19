name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: FSD lint
        run: npm run lint:fsd
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  backend:
    name: Backend — ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - run: ruff check backend tests

      - run: mypy backend/deckdna/domain backend/deckdna/contracts

      - name: LibreOffice + poppler (render pipeline deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-impress libreoffice-core poppler-utils \
            fonts-dejavu fonts-liberation fonts-noto \
            fonts-crosextra-carlito fonts-crosextra-caladea

      - run: pytest tests -q -n auto --dist loadscope

  compose:
    name: Docker Compose — build + health smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - run: docker compose config --quiet
      - run: docker compose up -d --build

      - name: Wait for web and api health
        run: |
          for i in $(seq 1 60); do
            ok_web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            ok_api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/live || true)
            [ "$ok_web" = "200" ] && [ "$ok_api" = "200" ] && exit 0
            echo "Waiting for services ($i/60): web=$ok_web api=$ok_api"
            sleep 3
          done
          docker compose logs --tail=100
          echo "health smoke failed: web=$ok_web api=$ok_api"
          exit 1

      - name: Front-to-back proxy check
        run: |
          curl -fsS http://localhost:8080/api/v1/health/live | grep -q '"ok"'
          curl -fsS http://localhost:8080/ | grep -qi "deckdna\|<div id=\"root\""

      - name: Tear down
        if: always()
        run: docker compose down

  release-check:
    name: Validate release tag
    needs: [frontend, backend, compose]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check version, source and publication window
        env:
          TAG: ${{ github.ref_name }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_CUTOFF_UTC: ${{ vars.RELEASE_CUTOFF_UTC }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag'; exit 1; }
          [[ -n "$HUB_USER" && -n "$HUB_TOKEN" ]] || { echo 'Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets'; exit 1; }
          [[ "$RELEASE_CUTOFF_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo 'Set RELEASE_CUTOFF_UTC in UTC ISO-8601 format'; exit 1; }
          cutoff="$(date -u -d "$RELEASE_CUTOFF_UTC" +%s)"
          (( cutoff - $(date -u +%s) >= 7200 )) || { echo 'Release window is closed or too short for the build'; exit 1; }
          git fetch --quiet origin main
          git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main || { echo 'Release tag must point to a commit on main'; exit 1; }

  publish:
    name: Publish ${{ matrix.service }} to GHCR and Docker Hub
    needs: release-check
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            dockerfile: backend/Dockerfile
          - service: web
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check publication window
        env:
          RELEASE_CUTOFF_UTC: ${{ vars.RELEASE_CUTOFF_UTC }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$RELEASE_CUTOFF_UTC" +%s)"
          (( cutoff - $(date -u +%s) >= 3600 )) || { echo 'Publication window is closed or too short'; exit 1; }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/it-aul/deckdna-${{ matrix.service }}:${{ github.ref_name }}
            docker.io/renatgubaudullin/deckdna-${{ matrix.service }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=deckdna-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=deckdna-${{ matrix.service }}

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create release for the verified tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_CUTOFF_UTC: ${{ vars.RELEASE_CUTOFF_UTC }}
        run: |
          set -euo pipefail
          (( $(date -u +%s) < $(date -u -d "$RELEASE_CUTOFF_UTC" +%s) )) || { echo 'Release window is closed'; exit 1; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "DeckDNA $TAG" --generate-notes
          fi
